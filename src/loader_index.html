<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ららぽーとBBCC 攻略ブック</title>
<style>
  html,body{margin:0;background:#f4efe3;color:#2b2620;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif}
  .ld{padding:26px 20px;font-size:14px;color:#847b6c}
</style>
</head>
<body>
<div class="ld">読み込み中…</div>
<script>
// 同じURLで常に最新を表示するためのローダー。
// 本体(app.html)を毎回キャッシュ回避で取得して差し替える。
(function(){
  var url = 'app.html?_=' + Date.now();
  fetch(url, {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw 0; return r.text(); })
    .then(function(t){ document.open(); document.write(t); document.close(); })
    .catch(function(){ location.replace(url); });
})();
</script>
</body>
</html>
